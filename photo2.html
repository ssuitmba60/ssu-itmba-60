<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2026 세부 문화탐방</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/css/lightgallery-bundle.min.css"/>

    <style>

        body{
            margin:0;
            background:#111;
        }

        #loading{
            position:fixed;
            width:100%;
            height:100%;
            background:#111;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-size:20px;
        }

        .photo{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
            gap:10px;
            padding:20px;
        }

        .photo img{
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:6px;
        }

    </style>
</head>

<body>

<div id="loading">사진 목록 생성 중...</div>

<div id="gallery" class="photo"></div>

<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.2/lightgallery.min.js"></script>

<script>
    const gallery = document.getElementById("gallery");

    const folder = "./2026-sebu/";
    const prefix = "sebu_";
    const total = 583; // 사진 개수

    for(let i=1;i<=total;i++){

        const num = String(i).padStart(5,"0");

        const file = folder + prefix + num + ".jpg";

        const a = document.createElement("a");
        a.href = file;

        const img = document.createElement("img");
        img.loading="lazy";
        img.src = file;

        a.appendChild(img);
        gallery.appendChild(a);
    }

    document.getElementById("loading").style.display="none";

    lightGallery(gallery,{
        selector:'a',
        speed:300,
        download:true,
        zoom:true
    });

</script>
